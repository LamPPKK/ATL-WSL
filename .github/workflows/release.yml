name: Build v0.2 draft release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  wsl:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            linux_arch: x86_64
            artifact_arch: x64
          - runner: ubuntu-24.04-arm
            linux_arch: aarch64
            artifact_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Build native packages, update bundle, and rootfs
        run: |
          docker run --rm -e SOURCE_DATE_EPOCH -v "${{ github.workspace }}:/work" -w /work alpine:3.24 \
            sh -c "apk add --no-cache bash git && git config --global --add safe.directory /work && bash build/build-release.sh ${{ matrix.linux_arch }}"
          cp "artifacts/release/ATL-WSL-Runtime-0.2.0-${{ matrix.artifact_arch }}.tar.gz" "$RUNNER_TEMP/runtime-first.tar.gz"
          docker run --rm -e SOURCE_DATE_EPOCH -v "${{ github.workspace }}:/work" -w /work alpine:3.24 \
            sh -c "apk add --no-cache bash coreutils && bash build/build-runtime-bundle.sh ${{ matrix.linux_arch }}"
          cmp "$RUNNER_TEMP/runtime-first.tar.gz" "artifacts/release/ATL-WSL-Runtime-0.2.0-${{ matrix.artifact_arch }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: wsl-${{ matrix.artifact_arch }}
          path: |
            artifacts/release/*-${{ matrix.artifact_arch }}.wsl
            artifacts/release/*-${{ matrix.artifact_arch }}.wsl.sha256
            artifacts/release/ATL-WSL-Runtime-*-${{ matrix.artifact_arch }}.tar.gz
            artifacts/release/ATL-WSL-Runtime-*-${{ matrix.artifact_arch }}.tar.gz.sha256
            artifacts/release/*-${{ matrix.artifact_arch }}.packages.txt
            artifacts/release/*-${{ matrix.artifact_arch }}.spdx.json

  manager:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            rid: win-x64
          - runner: windows-11-arm
            rid: win-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400
      - name: Create embedded release key ring
        shell: pwsh
        env:
          RELEASE_PUBLIC_KEY_BASE64: ${{ secrets.RELEASE_PUBLIC_KEY_BASE64 }}
        run: python tools/create-key-ring.py --key-id release-2026 --public-key-base64 "$env:RELEASE_PUBLIC_KEY_BASE64" --output artifacts/release/release-public-keys.json
      - run: dotnet run --project .\tests\ATLWSL.Core.Smoke\ATLWSL.Core.Smoke.csproj --configuration Release
      - name: Publish native manager
        shell: pwsh
        run: .\scripts\publish-manager.ps1 -RuntimeIdentifiers ${{ matrix.rid }} -ReleaseKeyRingPath "${{ github.workspace }}\artifacts\release\release-public-keys.json"
      - uses: actions/upload-artifact@v4
        id: upload-unsigned-manager
        with:
          name: manager-unsigned-${{ matrix.rid }}
          path: artifacts/release/ATL-WSL-Manager-*.zip
      - name: Authenticode sign manager through SignPath Foundation
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-manager.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/signed
      - name: Verify signed manager
        shell: pwsh
        run: |
          $archive = Get-ChildItem artifacts/signed -Recurse -Filter "ATL-WSL-Manager-0.2.0-${{ matrix.rid }}.zip" | Select-Object -First 1
          if (-not $archive) { throw 'SignPath did not return the expected manager archive.' }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath artifacts/signed-check
          $signature = Get-AuthenticodeSignature 'artifacts/signed-check/ATL-WSL Manager.exe'
          if ($signature.Status -ne 'Valid') { throw "Authenticode verification failed: $($signature.StatusMessage)" }
      - uses: actions/upload-artifact@v4
        with:
          name: manager-signed-${{ matrix.rid }}
          path: artifacts/signed

  sources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - run: |
          docker run --rm -e SOURCE_DATE_EPOCH -v "${{ github.workspace }}:/work" -w /work alpine:3.24 \
            sh -c "apk add --no-cache bash coreutils curl git tar && git config --global --add safe.directory /work && bash build/create-source-bundle.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: sources
          path: artifacts/release/ATL-WSL-*-sources.tar.gz*

  metadata:
    needs: [wsl, manager, sources]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wsl-*
          path: artifacts/release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: manager-signed-*
          path: artifacts/release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sources
          path: artifacts/release
      - name: Require manifest signing and SignPath onboarding
        env:
          RELEASE_SIGNING_KEY_PEM: ${{ secrets.RELEASE_SIGNING_KEY_PEM }}
          RELEASE_PUBLIC_KEY_BASE64: ${{ secrets.RELEASE_PUBLIC_KEY_BASE64 }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
        run: test -n "$RELEASE_SIGNING_KEY_PEM" && test -n "$RELEASE_PUBLIC_KEY_BASE64" && test -n "$SIGNPATH_ORGANIZATION_ID" && test -n "$SIGNPATH_PROJECT_SLUG"
      - name: Generate and sign release metadata
        env:
          RELEASE_SIGNING_KEY_PEM: ${{ secrets.RELEASE_SIGNING_KEY_PEM }}
          RELEASE_PUBLIC_KEY_BASE64: ${{ secrets.RELEASE_PUBLIC_KEY_BASE64 }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then test "${GITHUB_REF_NAME#v}" = "$(tr -d '\r\n' < VERSION)"; fi
          python3 tools/create-release-manifest.py --directory artifacts/release \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            --output artifacts/release/release-manifest.json --signing-key-id release-2026
          install -m 0600 /dev/null "$RUNNER_TEMP/release-key.pem"
          printf '%s' "$RELEASE_SIGNING_KEY_PEM" > "$RUNNER_TEMP/release-key.pem"
          build/sign-manifest.sh artifacts/release/release-manifest.json "$RUNNER_TEMP/release-key.pem" artifacts/release/release-manifest.json.sig
          build/verify-manifest-signature.sh artifacts/release/release-manifest.json artifacts/release/release-manifest.json.sig "$RUNNER_TEMP/release-key.pem" "$RELEASE_PUBLIC_KEY_BASE64"
          python3 tools/create-key-ring.py --key-id release-2026 --public-key-base64 "$RELEASE_PUBLIC_KEY_BASE64" --output artifacts/release/release-public-keys.json
          cp scripts/install-atl-wsl.ps1 artifacts/release/install-atl-wsl.ps1
          (cd artifacts/release && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/release/*
      - uses: actions/upload-artifact@v4
        with:
          name: atl-wsl-draft-release
          path: artifacts/release

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: atl-wsl-draft-release
          path: artifacts/release
      - name: Create draft GitHub release only
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/release/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes --title "ATL-WSL ${GITHUB_REF_NAME#v}"
